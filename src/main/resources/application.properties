spring.application.name=todo

# PostgreSQL datasource (overridable via environment variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todo}
spring.datasource.username=${DB_USER:todo}
spring.datasource.password=${DB_PASSWORD:todo}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Do not let Spring initialize schema (we initialize via Docker)
spring.sql.init.mode=never
