<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <header th:fragment="header" class="site-header">
        <div class="header-inner">
            <div class="brand">
                <a th:href="@{/}">Notes</a>
            </div>
            <nav class="header-nav">
                <span th:if="${userPrincipal}" class="user-info">
                    <span>Welcome, <strong th:text="${userPrincipal.username}"></strong></span>
                    <a th:href="@{/notes}">My Notes</a>
                    <a th:href="@{/tags}">My Tags</a>
                    <a th:href="@{/logout}">Logout</a>
                </span>
                <span th:unless="${userPrincipal}" class="auth-links">
                    <a th:href="@{/login}">Login</a>
                    <a th:href="@{/register}">Register</a>
                </span>
            </nav>
        </div>
    </header>
</body>
</html>
