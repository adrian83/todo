<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="form_messages">
<div th:if="${message != null}" class="success-message" th:text="${message}"></div>
<div th:if="${error != null}" class="error-message" th:text="${error}"></div>
<div th:if="${hasErrors}" class="error-message">Please correct the errors below.</div>
</div>
</body>
</html>
