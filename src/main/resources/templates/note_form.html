<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Note</title>
        <link rel="stylesheet" th:href="@{/style.css}">
    </head>
    <body>
        <div th:insert="~{fragments/header :: header}"></div>
        <h1 th:text="${noteId} != null ? 'Edit Note' : 'Create Note'">Create Note</h1>

        <form class="app-form" th:action="${noteId} != null ? @{/notes/{id}(id=${noteId})} : @{/notes}" th:object="${newNoteRequest}" method="post">
            <div th:insert="~{fragments/messages :: form_messages}"></div>
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" />
                <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div>
                <label for="content">Content</label>
                <textarea id="content" th:field="*{content}" rows="6" cols="60"></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
            </div>
            <div>
                <label>Tags</label>
                <div th:if="${availableTags}" class="checkbox-list">
                    <div th:each="tag : ${availableTags}">
                        <input type="checkbox" th:id="'tag_' + ${tag.id}" th:field="*{tagIds}" th:value="${tag.id}" />
                        <label th:for="'tag_' + ${tag.id}" th:text="${tag.name}">Tag</label>
                    </div>
                </div>
                <div th:unless="${availableTags}">
                    <p class="meta">No tags available. <a th:href="@{/tags}">Create tags</a></p>
                </div>
            </div>
            <div>
                <button type="submit">Save</button>
                <a th:href="@{/notes}">Cancel</a>
            </div>
        </form>

    </body>
</html>
